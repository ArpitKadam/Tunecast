[project]
name = "tunecast"
version = "0.1.0"
description = "Self-hosted MiniMax Music 3 song-generation server for RunPod"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "huggingface_hub>=1.0,<2",
]

[dependency-groups]
dev = [
    "httpx2>=2.12.0",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tunecast"]
